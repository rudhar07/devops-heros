# Single-node kind cluster for the session 20 homework.
# NodePorts are mapped to host ports so Grafana/Prometheus/ArgoCD/app/Alertmanager
# are reachable from macOS without keeping port-forwards alive.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: hw-e
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30100   # Grafana       -> http://localhost:8084
        hostPort: 8084
      - containerPort: 30101   # Prometheus    -> http://localhost:8085
        hostPort: 8085
      - containerPort: 30102   # ArgoCD (https)-> https://localhost:8086
        hostPort: 8086
      - containerPort: 30103   # podinfo app   -> http://localhost:8087
        hostPort: 8087
      - containerPort: 30104   # Alertmanager  -> http://localhost:30104
        hostPort: 30104
