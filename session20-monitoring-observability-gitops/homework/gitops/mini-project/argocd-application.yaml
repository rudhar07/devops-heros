# Apply this file from your local/admin environment; do not put it under the Git source path.
# Homework copy of 08-mini-project/app/argocd-application.yaml. Only repoURL and path changed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: session20-mini
  namespace: argocd
spec:
  project: default

  source:
    repoURL: git://hw-e-gitd/gitops-demo-repo   # was https://github.com/YOUR_USERNAME/YOUR_GITOPS_REPO.git
    targetRevision: main
    path: mini   # in the demo repo the mini-project manifests live in mini/

  destination:
    server: https://kubernetes.default.svc
    namespace: session20

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
