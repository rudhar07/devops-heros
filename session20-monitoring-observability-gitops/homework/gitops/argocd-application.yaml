# Applied once from my admin shell (kubectl apply). It is NOT inside the watched app/ path.
# Repo = throwaway local Git server (git daemon container "hw-e-gitd" on the docker network "kind"),
# because the demo must not depend on GitHub.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-demo-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://hw-e-gitd/gitops-demo-repo
    targetRevision: main
    path: app
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo
  syncPolicy:
    automated:
      prune: true      # delete resources whose manifest was removed from Git
      selfHeal: true   # undo manual changes made directly in the cluster
    syncOptions:
      - CreateNamespace=true
