# Case 6 (autoscaling layer): HPA on a Deployment whose container has no CPU
# request. Utilisation = usage / request, so the HPA cannot compute it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-demo
  namespace: taskboard
  labels: {app: hpa-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: hpa-demo}}
  template:
    metadata: {labels: {app: hpa-demo}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 101, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: web
          image: taskboard-frontend:local
          ports: [{containerPort: 8080}]
          env: [{name: BACKEND_URL, value: "http://taskboard-backend:8000"}]
          # resources: {}   <- the bug: no requests
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-demo
  namespace: taskboard
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: hpa-demo}
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 50}}
