{{- if not .Values.secret.existingSecret }}
# Demo Secret rendered from values (FAKE password). With secret.existingSecret
# set, this is skipped and the backend/postgres read that Secret instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskboard.secretName" . }}
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.secret.username | quote }}
  DB_PASSWORD: {{ .Values.secret.password | quote }}
{{- end }}
