apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskboard.fullname" . }}-backend
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "taskboard.selectorLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
  ports:
    - name: http          # the ServiceMonitor scrapes this port by name
      port: {{ .Values.backend.port }}
      targetPort: http
