# / -> frontend, /api -> backend. Needs an Ingress controller (ingress-nginx).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskboard
  labels: {app.kubernetes.io/name: taskboard}
spec:
  ingressClassName: nginx
  rules:
    - host: taskboard-raw.localhost
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: taskboard-backend, port: {name: http}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: taskboard-frontend, port: {name: http}}}
