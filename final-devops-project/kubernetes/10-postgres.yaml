# PostgreSQL for dev/demo: PVC (storage survives pod restarts) + Deployment
# (Recreate, one pod owns the RWO volume) + ClusterIP Service.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: taskboard-postgres-data
  labels: {app.kubernetes.io/name: taskboard, app.kubernetes.io/component: postgres}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: taskboard-postgres
  labels: {app.kubernetes.io/name: taskboard, app.kubernetes.io/component: postgres}
spec:
  selector: {app.kubernetes.io/name: taskboard, app.kubernetes.io/component: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-postgres
  labels: {app.kubernetes.io/name: taskboard, app.kubernetes.io/component: postgres}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: taskboard, app.kubernetes.io/component: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: taskboard, app.kubernetes.io/component: postgres}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: postgres:17.11-alpine
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: taskboard}
            - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: taskboard-db, key: DB_USER}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: taskboard-db, key: DB_PASSWORD}}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: taskboard-postgres-data}}
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
