# React app served by unprivileged nginx (UID 101, port 8080).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-frontend
  labels: {app.kubernetes.io/name: taskboard, app.kubernetes.io/component: frontend}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: taskboard, app.kubernetes.io/component: frontend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: taskboard, app.kubernetes.io/component: frontend}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: frontend
          image: taskboard-frontend:local
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: BACKEND_URL, value: "http://taskboard-backend:8000"}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 3, periodSeconds: 10, timeoutSeconds: 3}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 2, periodSeconds: 5, timeoutSeconds: 3}
          resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {cpu: 200m, memory: 64Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: nginx-conf, mountPath: /etc/nginx/conf.d}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: nginx-conf, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: taskboard-frontend
  labels: {app.kubernetes.io/name: taskboard, app.kubernetes.io/component: frontend}
spec:
  selector: {app.kubernetes.io/name: taskboard, app.kubernetes.io/component: frontend}
  ports:
    - {name: http, port: 80, targetPort: http}
