# TEMPLATE with a FAKE demo password. Real credentials never go into Git:
# create them with kubectl create secret / Sealed Secrets / External Secrets.
#   kubectl -n <ns> create secret generic taskboard-db \
#     --from-literal=DB_USER=taskboard --from-literal=DB_PASSWORD='<real password>'
apiVersion: v1
kind: Secret
metadata:
  name: taskboard-db
  labels: {app.kubernetes.io/name: taskboard, app.kubernetes.io/part-of: taskboard}
type: Opaque
stringData:
  DB_USER: taskboard
  DB_PASSWORD: demo-password-123
