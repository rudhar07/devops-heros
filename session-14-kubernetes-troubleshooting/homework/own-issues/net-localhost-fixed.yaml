# Fixed: bind to 0.0.0.0 so the app listens on the pod IP too.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: python:3.11-alpine
          command: ["python3", "-m", "http.server", "8080", "--bind", "0.0.0.0"]
          ports:
            - containerPort: 8080
          # Added with the fix: only mark the pod Ready once the port answers on the pod IP.
          # (The kubelet probes the pod IP, so this probe would also have flagged the
          # 127.0.0.1-only version as not ready.)
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8080
