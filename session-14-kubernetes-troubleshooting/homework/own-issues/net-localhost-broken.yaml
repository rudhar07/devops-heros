# Pod networking issue 1: the app listens on 127.0.0.1 only.
# The Pod is Running and Ready (no probe), curl inside the pod works, but nothing
# outside the pod (other pods, the Service) can connect.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: python:3.11-alpine
          command: ["python3", "-m", "http.server", "8080", "--bind", "127.0.0.1"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8080
