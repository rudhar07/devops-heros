# Fix for ../../scenarios/scenario-1-crashloop/broken.yaml
# Root cause: the app exits 1 when DATABASE_URL is not set. Fix: provide it.
# The value is a FAKE demo connection string, not a real credential.
apiVersion: v1
kind: Pod
metadata:
  name: fail-1-crashloop-pod
  labels:
    tier: triage-gauntlet
    scenario: crashloop
spec:
  containers:
    - name: python-app
      image: python:3.11-alpine
      env:
        - name: DATABASE_URL
          value: "postgres://demo:demo-password-123@postgres-db.production.svc.cluster.local:5432/notes"
      command:
        - "python3"
        - "-c"
        - |
          import os, sys, time
          db_url = os.environ.get("DATABASE_URL")
          if not db_url:
              print("[FATAL ERROR]: DATABASE_URL environment variable is MISSING!", file=sys.stderr)
              sys.exit(1)
          print("Application started successfully!", flush=True)
          # keep running like a real server would (the original exits 0 right away,
          # which with restartPolicy Always is also a restart loop)
          while True:
              time.sleep(3600)
