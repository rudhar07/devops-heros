# Fix for ../09-service-dns-troubleshooting/dns-test-pod.yaml
# Root cause: registry.k8s.io/e2e-test-images/dnsutils:1.3 no longer exists on registry.k8s.io
# (registry answers "not found"; the repo's tag list is empty), so the pod sat in ImagePullBackOff.
# busybox has nslookup and wget, which is all the DNS/service tests need, and it is multi-arch.
apiVersion: v1
kind: Pod
metadata:
  name: dns-test
spec:
  containers:
    - name: dns-test
      image: busybox:1.36
      command:
        - sleep
        - "3600"
