# Small client pod I use to curl the Services from inside the cluster.
apiVersion: v1
kind: Pod
metadata:
  name: client
  labels:
    app: client
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.5.0
      command: ["sh", "-c", "sleep 36000"]
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
