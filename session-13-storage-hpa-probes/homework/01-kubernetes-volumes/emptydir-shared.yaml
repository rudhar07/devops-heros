# emptyDir shared by two containers in one Pod.
# "writer" appends a timestamp every 5s; "web" (nginx) serves the same directory.
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-shared
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo \"written by writer at $(date)\" >> /shared/index.html; sleep 5; done"]
      volumeMounts:
        - name: shared
          mountPath: /shared
    - name: web
      image: nginx:1.27
      volumeMounts:
        - name: shared
          mountPath: /usr/share/nginx/html
  volumes:
    - name: shared
      emptyDir: {}
