# Load generator for the mini project (same idea as the README's kubectl run, as a
# Deployment so I can scale it). Two pods hitting web-service in a wget loop.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: production-webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do wget -q -O- http://web-service > /dev/null; done"]
          resources:
            requests:
              cpu: 50m
            limits:
              cpu: 500m
