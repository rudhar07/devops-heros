# Small StatefulSet that shows the two things a Deployment cannot give you:
# a stable identity per pod (web-db-0, web-db-1) and a separate PersistentVolumeClaim per pod.
apiVersion: v1
kind: Service
metadata:
  name: web-db
spec:
  clusterIP: None
  selector:
    app: web-db
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web-db
spec:
  serviceName: web-db
  replicas: 2
  selector:
    matchLabels:
      app: web-db
  template:
    metadata:
      labels:
        app: web-db
    spec:
      containers:
        - name: app
          image: busybox:1.36
          # each pod writes its own name into its own volume once, then keeps it
          command: ["sh", "-c", "[ -f /data/owner ] || hostname > /data/owner; while true; do sleep 3600; done"]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 16Mi
