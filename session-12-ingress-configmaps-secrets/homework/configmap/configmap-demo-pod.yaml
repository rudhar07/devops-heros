# Uses the ConfigMap three ways:
#  1. envFrom          -> every key becomes an env var
#  2. env.valueFrom    -> one key, renamed (APP_LOG_LEVEL)
#  3. volume           -> every key becomes a file under /etc/yatri
apiVersion: v1
kind: Pod
metadata:
  name: configmap-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo started; sleep 36000"]
      envFrom:
        - configMapRef:
            name: yatri-app-config
      env:
        - name: APP_LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: yatri-app-config
              key: LOG_LEVEL
      volumeMounts:
        - name: config
          mountPath: /etc/yatri
          readOnly: true
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
  volumes:
    - name: config
      configMap:
        name: yatri-app-config
