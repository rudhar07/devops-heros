# Uses the Secret two ways: as env vars (secretKeyRef) and as files (secret volume, mode 0400).
apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo started; sleep 36000"]
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: yatri-db-secret
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: yatri-db-secret
              key: POSTGRES_PASSWORD
      volumeMounts:
        - name: db-creds
          mountPath: /etc/db-creds
          readOnly: true
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
  volumes:
    - name: db-creds
      secret:
        secretName: yatri-db-secret
        defaultMode: 0400
